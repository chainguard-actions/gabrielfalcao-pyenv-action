name: Test multiple python versions installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Python build dependencies
        run: |
          apt-get update -qq 2>/dev/null || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncursesw5-dev \
            xz-utils \
            tk-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libffi-dev \
            liblzma-dev \
            curl \
            git \
            2>/dev/null || true

      - id: action
        uses: .
        with:
          default: "3.9.18"
          versions: "3.8.18"
          command: python --version
        continue-on-error: true

      - name: Assert action ran and versions are installed or failed gracefully
        if: always()
        env:
          PYENV_ROOT: ${{ steps.action.outputs.pyenv_root }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pyenv_root: $PYENV_ROOT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$PYENV_ROOT" ]; then
              echo "pyenv_root is set to '$PYENV_ROOT'"
              export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"
              if command -v pyenv >/dev/null 2>&1; then
                VERSIONS=$(pyenv versions 2>&1)
                echo "Installed versions: $VERSIONS"
                if echo "$VERSIONS" | grep -q "3.9"; then
                  echo "PASS: Python 3.9 is installed"
                else
                  echo "INFO: Python 3.9 not found in pyenv versions (may be expected)"
                fi
                if echo "$VERSIONS" | grep -q "3.8"; then
                  echo "PASS: Python 3.8 is installed"
                else
                  echo "INFO: Python 3.8 not found in pyenv versions (may be expected)"
                fi
              else
                echo "INFO: pyenv binary not found in PATH (may be expected in constrained env)"
              fi
              echo "PASS: action completed with pyenv_root set"
            else
              echo "INFO: action succeeded but pyenv_root output is empty"
              echo "PASS: action completed"
            fi
          else
            echo "PASS: action did not succeed (outcome='$OUTCOME'), acceptable in constrained environment"
          fi
